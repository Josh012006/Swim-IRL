name: Tests
on:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          grep -v -i '^torch' external/NanoGoal-RL/requirements.txt > /tmp/nanogoal-requirements-no-torch.txt
          pip install -r /tmp/nanogoal-requirements-no-torch.txt --no-deps

      - name: Run tests
        run: python -m pytest